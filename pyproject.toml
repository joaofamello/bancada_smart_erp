[project]
name = "bancada-smart-erp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "João Francisco", email = "joaofrancisco.amello@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "supabase>=2.34.1",
]

[project.scripts]
bancada-smart-erp = "bancada_smart_erp:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
